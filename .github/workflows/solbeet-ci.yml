# Solbeet fork CI. Upstream workflows (ci-test, lint, docker-publish) are
# disabled in this fork: they need upstream secrets or publish upstream images.
name: Solbeet fork CI

on:
  push:
    branches: ["solbeet/**"]
    tags: ["v*-solbeet.*"]
  pull_request:
    branches: ["solbeet/**"]

permissions:
  contents: read

concurrency:
  group: solbeet-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Fork tests (Python 3.10)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install
        run: python -m pip install -e ".[mongo]" pytest pytest-asyncio pytest-bdd ruff

      - name: Fork commits sit on top of UPSTREAM_BASE
        run: |
          base=$(python -c "import parlant.solbeet as s; print(s.UPSTREAM_BASE)")
          git fetch --no-tags https://github.com/emcie-co/parlant.git "refs/tags/$base:refs/tags/$base"
          git merge-base --is-ancestor "$base" HEAD
          echo "fork commits on top of $base:"
          git log --oneline "$base..HEAD"

      - name: Tag matches FORK_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected=$(python -c "import parlant.solbeet as s; print('v' + s.FORK_VERSION.replace('+', '-'))")
          test "$GITHUB_REF_NAME" = "$expected" || { echo "tag $GITHUB_REF_NAME != $expected"; exit 1; }

      - name: Ruff on files changed by the fork
        run: |
          base=$(python -c "import parlant.solbeet as s; print(s.UPSTREAM_BASE)")
          files=$(git diff --name-only --diff-filter=AM "$base" HEAD -- '*.py')
          ruff check $files
          ruff format --check $files

      # Deterministic subset of the upstream suite (most of it needs LLM keys,
      # which this public fork does not hold) plus the fork's own tests. The two
      # deselected Mongo index tests already fail on v3.3.2 upstream.
      - name: Pytest
        env:
          TEST_MONGO_SERVER: mongodb://localhost:27017
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/solbeet
          tests/adapters/db/test_json_file.py
          tests/adapters/db/test_mongodb.py
          tests/core/test_id_generator.py
          tests/core/test_cancellation_suppression_latch.py
          tests/core/stable/persistence
          tests/core/common
          --deselect tests/adapters/db/test_mongodb.py::test_that_session_store_creates_indexes_for_session_hot_paths
          --deselect tests/adapters/db/test_mongodb.py::test_that_customer_store_creates_indexes_for_customer_and_tag_lookups
